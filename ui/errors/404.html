<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Page not found | PlainShow</title>
<style>
:root{--bg:#151515;--panel:#1d1d1d;--line:#2c2c2c;--text:#f2f2f2;--soft:#b9b9b9;--accent:#fc5000}
@media (prefers-color-scheme:light){:root{--bg:#f6f4f1;--panel:#fff;--line:#e4e0da;--text:#1b1b1b;--soft:#5f5f5f}}
:root[data-theme=dark]{--bg:#151515;--panel:#1d1d1d;--line:#2c2c2c;--text:#f2f2f2;--soft:#b9b9b9}
:root[data-theme=light]{--bg:#f6f4f1;--panel:#fff;--line:#e4e0da;--text:#1b1b1b;--soft:#5f5f5f}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;display:grid;place-items:center;padding:24px 16px;background:var(--bg);color:var(--text);font:16px/1.5 Outfit,system-ui,-apple-system,"Segoe UI",sans-serif;text-align:center}
main{max-width:460px}
img{width:min(260px,60vw);height:auto;display:block;margin:0 auto 8px}
.code{margin:0;color:var(--accent);font-weight:700;letter-spacing:.12em}
h1{margin:4px 0 8px;font:600 2rem/1.2 Georgia,"Times New Roman",serif}
p{margin:0 0 20px;color:var(--soft)}
.small{font-size:.9rem}
.actions{display:flex;gap:10px;justify-content:center;flex-wrap:wrap}
.btn{display:inline-block;padding:10px 18px;border:1px solid var(--line);border-radius:10px;background:var(--panel);color:var(--text);text-decoration:none;font-weight:500}
.btn.primary{background:var(--accent);border-color:var(--accent);color:#fff}
</style>
<script>try{var t=localStorage.getItem('plainshow-theme');if(t==='light'||t==='dark')document.documentElement.setAttribute('data-theme',t)}catch(e){}</script>
</head>
<body>
<main>
<img src="/_errors/404.webp" alt="" width="260" height="260">
<p class="code">404</p>
<h1 data-k="title">Page not found</h1>
<p data-k="text">This page does not exist, or it has moved.</p>
<div class="actions"><a class="btn" href="javascript:history.back()" data-k="back">Go back</a><a class="btn primary" href="/" data-k="home">Start page</a></div>
</main>
<script>(function(){var w={"nl":{"title":"Pagina niet gevonden","text":"Deze pagina bestaat niet, of is verplaatst.","back":"Terug","home":"Startpagina","soon":"Meestal binnen een minuut."},"sv":{"title":"Sidan finns inte","text":"Den här sidan finns inte, eller så har den flyttats.","back":"Tillbaka","home":"Startsidan","soon":"Oftast inom en minut."}};var m=document.cookie.match(/(?:^|; )ps_lang=([a-z]+)/);var l=m?m[1]:null;if(!w[l]&&l!=='en'){var a=navigator.languages||[navigator.language||'en'];for(var i=0;i<a.length;i++){var c=String(a[i]).slice(0,2).toLowerCase();if(w[c]||c==='en'){l=c;break;}}}var t=w[l];if(!t)return;document.documentElement.lang=l;document.querySelectorAll('[data-k]').forEach(function(n){var k=n.getAttribute('data-k');if(t[k])n.textContent=t[k];});document.title=t.title+' | PlainShow';})();</script>

</body>
</html>
